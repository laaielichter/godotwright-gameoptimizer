<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="484" viewBox="0 0 1000 484" role="img" aria-label="Output of gameoptimizer audit on the demo open world">
<rect width="1000" height="484" rx="10" fill="#0d1117"/><rect width="1000" height="30" rx="10" fill="#161b22"/><rect y="20" width="1000" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="6" fill="#ff5f56"/><circle cx="38" cy="15" r="6" fill="#ffbd2e"/><circle cx="58" cy="15" r="6" fill="#27c93f"/>
<text x="500" y="20" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" text-anchor="middle">gameoptimizer audit (real output, trimmed to the headlines)</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text x="20" y="58" fill="#8b949e">$ npx -y github:laaielichter/godotwright-gameoptimizer audit ./world</text><text x="20" y="100" fill="#e6edf3">Open World Demo  (Godot 4.7, forward_plus, 28 files, 2 scripts)</text><text x="20" y="121" fill="#8b949e">  world/world.tscn: 20128 nodes, 17837 mesh instances (11 unique), 4508k triangles,</text><text x="20" y="142" fill="#8b949e">                   261 lights (261 shadowed), 501 bodies, 2400 x 2400 m</text><text x="20" y="163" fill="#8b949e">    worst view: 3892k triangles, 15129 surfaces in range (cells of 128 m)</text><text x="20" y="184" fill="#8b949e">  textures: 7, about 28 MB of VRAM</text><text x="20" y="205" fill="#f0b72f">  score 9/100   high 4  medium 7  low 4</text><text x="20" y="247" fill="#ff7b72" font-weight="700">HIGH</text><text x="90" y="247" fill="#e6edf3">16k identical meshes are separate nodes (5 kinds)</text><text x="980" y="247" fill="#7ee787" text-anchor="end">gameoptimizer fix instancing</text><text x="20" y="268" fill="#ff7b72" font-weight="700">HIGH</text><text x="90" y="268" fill="#e6edf3">14k small objects are drawn at any distance</text><text x="980" y="268" fill="#7ee787" text-anchor="end">gameoptimizer fix ranges</text><text x="20" y="289" fill="#ff7b72" font-weight="700">HIGH</text><text x="90" y="289" fill="#e6edf3">260 of 260 omni and spot lights never fade out (260 cast shadows)</text><text x="980" y="289" fill="#7ee787" text-anchor="end">gameoptimizer fix lights</text><text x="20" y="310" fill="#ff7b72" font-weight="700">HIGH</text><text x="90" y="310" fill="#e6edf3">One scene holds a 2400 m world with 17k placed objects</text><text x="980" y="310" fill="#7ee787" text-anchor="end">gameoptimizer fix partition</text><text x="20" y="331" fill="#f0b72f" font-weight="700">MEDIUM</text><text x="90" y="331" fill="#e6edf3">760 placed copies of 2 scenes or models live in one scene</text><text x="980" y="331" fill="#7ee787" text-anchor="end">gameoptimizer fix partition</text><text x="20" y="352" fill="#f0b72f" font-weight="700">MEDIUM</text><text x="90" y="352" fill="#e6edf3">1587 objects smaller than 70 cm cast shadows</text><text x="980" y="352" fill="#7ee787" text-anchor="end">gameoptimizer fix ranges</text><text x="20" y="373" fill="#f0b72f" font-weight="700">MEDIUM</text><text x="90" y="373" fill="#e6edf3">260 omni lights use cube shadows</text><text x="980" y="373" fill="#7ee787" text-anchor="end">gameoptimizer fix lights</text><text x="20" y="394" fill="#f0b72f" font-weight="700">MEDIUM</text><text x="90" y="394" fill="#e6edf3">No occluders in a scene with many large objects</text><text x="980" y="394" fill="#7ee787" text-anchor="end">gameoptimizer fix settings</text><text x="20" y="436" fill="#7ee787">Plan: install &gt; settings &gt; textures &gt; lights &gt; ranges &gt; instancing &gt; partition</text><text x="20" y="457" fill="#8b949e">Measure first: gameoptimizer bench --label baseline</text></g></svg>
